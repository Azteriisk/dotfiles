# Override to ignore specific background crash notifications in Omarchy crash watch.
# To re-enable WebKit crash alerts later, delete this file and restart the service:
#   rm -f ~/.config/systemd/user/omarchy-crash-watch.service.d/override.conf
#   systemctl --user daemon-reload && systemctl --user restart omarchy-crash-watch.service

[Service]
Environment="OMARCHY_CRASH_IGNORE=^WebKitWebProcess$"
